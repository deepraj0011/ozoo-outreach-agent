<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozoo Outreach Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Inter','ui-sans-serif','system-ui'] },
  colors: { ink: { 950:'#0c1222', 900:'#121a2e', 800:'#1b2540', 700:'#2a3557' },
            brand: { 50:'#eef3ff', 100:'#dce6ff', 200:'#bccdff', 500:'#4c6fff', 600:'#3a5af0', 700:'#2c46cc' } } } } }
</script>
<style>
  body { font-feature-settings: "cv02","cv03","cv04","cv11"; }
  .thin::-webkit-scrollbar { width: 6px; height: 6px; } .thin::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:6px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; border-radius:.55rem; padding:.5rem .8rem; font-size:.8125rem; font-weight:500;
         border:1px solid #e2e8f0; background:#fff; color:#1e293b; transition:all .15s; white-space:nowrap; }
  .btn:hover { border-color:#4c6fff; color:#2c46cc; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:#4c6fff; border-color:#4c6fff; color:#fff; } .btn-primary:hover { background:#3a5af0; color:#fff; }
  .btn-sm { padding:.35rem .6rem; font-size:.75rem; }
  .wa-btn { display:flex; align-items:center; justify-content:center; gap:.35rem; width:100%; margin-top:2px; padding:.45rem .75rem; border-radius:.5rem;
    font-size:.8125rem; font-weight:500; color:#027eb5; box-shadow:0 1px .5px rgba(11,20,26,.13); }
  button.wa-btn:hover { filter:brightness(.97); }
  .wa-btn[disabled] { cursor:default; filter:none; }
  .card { background:#fff; border:1px solid #e5e9f0; border-radius:.9rem; }
  .nav-a { display:flex; align-items:center; gap:.7rem; padding:.55rem .75rem; border-radius:.55rem; color:#a9b3cc; font-size:.875rem; font-weight:500; }
  .nav-a:hover { background:#1b2540; color:#fff; } .nav-a.on { background:#4c6fff; color:#fff; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.35 } }
  .fade { animation: fade .25s ease-out; } @keyframes fade { from { opacity:0; transform: translateY(4px) } }
  .slide { animation: slide .22s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity:0 } }
  input, textarea, select { outline: none; } input:focus, textarea:focus, select:focus { border-color:#4c6fff !important; box-shadow: 0 0 0 3px #dce6ff; }
</style>
</head>
<body class="bg-[#f5f7fb] text-slate-800 font-sans antialiased">
<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="hidden md:flex w-60 shrink-0 bg-ink-950 text-white flex-col fixed inset-y-0">
    <div class="px-5 h-16 flex items-center gap-2.5 border-b border-white/5">
      <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-brand-500 to-violet-500 grid place-items-center font-bold">O</div>
      <div class="leading-tight"><div class="font-semibold text-sm">Ozoo.ai</div><div class="text-[11px] text-slate-400">Outreach Agent</div></div>
    </div>
    <nav class="p-3 space-y-1" id="nav"></nav>
    <div class="mt-auto p-4 space-y-3 border-t border-white/5">
      <div class="flex items-center gap-2 text-xs text-emerald-300"><span class="h-2 w-2 rounded-full bg-emerald-400 pulse"></span>Agent running</div>
      <div class="text-[11px] text-slate-400">Agent time<div id="clock" class="text-slate-200 text-xs mt-0.5">—</div></div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 md:ml-60 min-w-0">
    <header class="h-16 bg-white border-b border-slate-200 px-4 sm:px-8 flex items-center gap-4 sticky top-0 z-20">
      <div class="min-w-0"><h1 id="pageTitle" class="font-semibold text-[15px] truncate"></h1><p id="pageSub" class="text-xs text-slate-500 truncate"></p></div>
      <div class="ml-auto flex items-center gap-2" id="pageActions"></div>
    </header>
    <div id="page" class="p-4 sm:p-8 max-w-[1400px]"></div>
  </main>
</div>

<!-- Lead drawer -->
<div id="drawerWrap" class="hidden fixed inset-0 z-40">
  <div class="absolute inset-0 bg-ink-950/30" onclick="closeLead()"></div>
  <aside id="drawer" class="slide absolute right-0 inset-y-0 w-full max-w-[640px] bg-white shadow-2xl flex flex-col"></aside>
</div>

<!-- Modal -->
<div id="modalWrap" class="hidden fixed inset-0 z-50 bg-ink-950/40 backdrop-blur-sm grid place-items-center p-4">
  <div id="modal" class="fade bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col"></div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-5 right-5 z-[60] bg-ink-950 text-white text-sm rounded-xl px-4 py-3 shadow-xl max-w-sm"></div>

<script src="/demo/templates.js"></script>
<script src="/demo/schedule.js"></script>
<script>
// ------------------------------------------------------------------ vocabulary (plan-aligned)
const STATE = {
  intake:{label:'New',group:'Intake',c:'bg-slate-100 text-slate-700',d:'bg-slate-400'},
  in_sequence:{label:'In outreach',group:'Outreach',c:'bg-blue-50 text-blue-700',d:'bg-blue-500'},
  paused:{label:'On hold',group:'Outreach',c:'bg-amber-50 text-amber-700',d:'bg-amber-500'},
  engaged:{label:'Replied',group:'Responding',c:'bg-cyan-50 text-cyan-700',d:'bg-cyan-500'},
  qualifying:{label:'Interested',group:'Responding',c:'bg-violet-50 text-violet-700',d:'bg-violet-500'},
  booked:{label:'Meeting booked',group:'Booked',c:'bg-emerald-50 text-emerald-700',d:'bg-emerald-500'},
  handed_off:{label:'Handed to sales',group:'Handed off',c:'bg-green-100 text-green-800',d:'bg-green-600'},
  nurture:{label:'Nurture',group:'Nurture',c:'bg-orange-50 text-orange-700',d:'bg-orange-400'},
  closed:{label:'Closed',group:'Stopped',c:'bg-slate-100 text-slate-600',d:'bg-slate-500'},
  suppressed:{label:'Do not contact',group:'Stopped',c:'bg-rose-50 text-rose-700',d:'bg-rose-500'},
  rejected:{label:'Rejected at intake',group:'Stopped',c:'bg-rose-50 text-rose-700',d:'bg-rose-400'},
  archived:{label:'Archived',group:'Stopped',c:'bg-slate-100 text-slate-500',d:'bg-slate-300'},
};
const GROUPS = ['All','Outreach','Responding','Booked','Handed off','Nurture','Stopped'];
const KIND = {
  state_change:'Status changed', sent:'Email sent', reply:'Email reply', click:'Link clicked', open:'Email opened', visit:'Page read (verified visit)',
  bounce_hard:'Email bounced', bounce_soft:'Soft bounce', unsubscribe:'Unsubscribed', wa_text:'WhatsApp message', wa_button:'WhatsApp button tapped',
  wa_sent:'WhatsApp sent', wa_delivered:'WhatsApp delivered', wa_read:'WhatsApp read', wa_failed:'WhatsApp failed', booking_created:'Meeting booked',
  booking_cancelled:'Meeting cancelled', booking_rescheduled:'Meeting rescheduled', meeting_ended:'Meeting held', no_show:'No-show', form_submitted:'Booking form answered',
  teams_command:'Sales action', integration_error:'Integration issue', manual_email:'Email sent from a template',
};
const ALERT = {
  hot_lead:['Hot lead','bg-rose-50 text-rose-700'], click_check:['Clicks only: check first','bg-amber-50 text-amber-700'], booked:['Meeting booked','bg-emerald-50 text-emerald-700'], handoff:['Handed to sales','bg-green-100 text-green-800'],
  wa_human_needed:['Chat needs a person','bg-violet-50 text-violet-700'], engaged:['Lead engaged','bg-cyan-50 text-cyan-700'], stuck_lead:['Stuck lead','bg-amber-50 text-amber-700'],
  unsure:['Reply needs a look','bg-amber-50 text-amber-700'], integration_error:['Integration issue','bg-rose-50 text-rose-700'], tool_stop_failed:['Stop failed','bg-rose-50 text-rose-700'],
};
const AI = {interested:'Interested', question:'Has a question', not_now:'Not now', not_interested:'Not interested', unsubscribe:'Unsubscribe', ooo:'Out of office', wrong_person:'Wrong person', unsure:'Unsure'};
const ICON = {
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  overview:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  leads:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
  flow:'<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 18h2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
};
const PAGES = [
  {id:'overview', label:'Overview', icon:'overview', title:'Overview', sub:'How the agent is doing, at a glance'},
  {id:'leads', label:'Leads', icon:'leads', title:'Leads', sub:'Everyone the agent is following up with'},
  {id:'conversations', label:'Conversations', icon:'chat', title:'WhatsApp conversations', sub:'Chatbot and salesperson chats with leads'},
  {id:'templates', label:'Email templates', icon:'mail', title:'Email templates', sub:'Preview, write, approve and send the emails the agent uses'},
  {id:'schedule', label:'Email schedule', icon:'calendar', title:'Email schedule', sub:'When each email goes, and what kind it is'},
  {id:'alerts', label:'Sales alerts', icon:'bell', title:'Sales alerts', sub:'What the sales team is told (Microsoft Teams in production)'},
  {id:'how', label:'How it works', icon:'flow', title:'How the agent works', sub:'The outreach plan, step by step'},
  {id:'settings', label:'Settings', icon:'gear', title:'Settings', sub:'Connections, time controls and sample data'},
];

// ------------------------------------------------------------------ helpers
const $ = id => document.getElementById(id);
// Event title + who did it. Unsubscribe-link visits only show the confirm page (nothing happens
// unless the button is pressed), so they are named for what they are. Scanner / automatic
// opens and clicks are tagged and never counted. The hidden trap link is only ever visited by
// security scanners (no person can see it).
const evTitle = e => e.kind !== 'click' ? (KIND[e.kind] || e.kind)
  : /(^|· )link: unsubscribe( ·|$)/.test(e.summary || '') ? 'Unsubscribe page opened'
  : /(^|· )link: trap( ·|$)/.test(e.summary || '') ? 'Hidden trap link visited' : (KIND[e.kind] || e.kind);
const evTag = e => {
  const t = e.verdict === 'bot' ? 'security scanner, ignored' : e.verdict === 'machine' ? 'automatic (Apple Mail), ignored'
    : (e.verdict == null && ['click','open','visit'].includes(e.kind)) ? 'checking…' : '';
  return t ? ` <span class="text-[10px] bg-slate-100 text-slate-500 rounded px-1.5 font-normal">${t}</span>` : '';
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (k, cls='h-[18px] w-[18px]') => `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">${ICON[k]}</svg>`;
const badge = st => { const m = STATE[st] || {label:st,c:'bg-slate-100'}; return `<span class="inline-flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full whitespace-nowrap ${m.c}"><span class="h-1.5 w-1.5 rounded-full ${m.d||''}"></span>${esc(m.label)}</span>`; };
const when = iso => { if (!iso) return '—'; const d = new Date(iso), now = data ? new Date(data.clock) : new Date(), s = (now - d)/1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60) + ' min ago'; if (s < 86400) return Math.floor(s/3600) + ' h ago';
  return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); };
const chan = (c, sw) => (c === 'whatsapp' ? '<span class="text-emerald-700">WhatsApp</span>' : c === 'email' ? '<span class="text-blue-700">Email</span>' : '<span class="text-slate-400">—</span>') + (sw ? ' <span class="text-[10px] text-slate-400">switched</span>' : '');
const bandC = b => ({hot:'text-rose-600', warm:'text-amber-600'}[b] || 'text-slate-400');
const initials = n => esc((n||'?').split(/\s+/).map(x => x[0]).join('').slice(0,2).toUpperCase());
const avatar = (n, size='h-9 w-9 text-xs') => `<div class="${size} shrink-0 rounded-full bg-gradient-to-br from-brand-100 to-violet-100 text-brand-700 grid place-items-center font-semibold">${initials(n)}</div>`;
const empty = (msg, action='') => `<div class="py-16 px-6 text-center"><div class="text-sm text-slate-500">${msg}</div>${action}</div>`;
function toast(msg, ok=true) { const t = $('toast'); t.textContent = msg; t.className = `fixed bottom-5 right-5 z-[60] text-white text-sm rounded-xl px-4 py-3 shadow-xl max-w-sm ${ok ? 'bg-ink-950' : 'bg-rose-600'}`;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 3500); }

// ------------------------------------------------------------------ state + routing
let data = null, detail = null, openId = null, page = 'overview', leadFilter = 'All', leadSearch = '', convId = null, convDetail = null, drawerTab = 'activity';

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [p, id] = h.split('/');
  page = PAGES.some(x => x.id === p) ? p : 'overview';
  if (p === 'leads' && id) openLead(+id);
  if (p === 'import') { page = 'leads'; setTimeout(() => openImport(), 50); }
  lastRendered = ''; renderPage();
}
window.addEventListener('hashchange', route);

async function refresh() {
  try {
    const r = await fetch('/demo/api/state'); data = await r.json();
    if (openId != null) { const d = await fetch('/demo/api/lead/' + openId); detail = d.ok ? await d.json() : null;
      if (drawerTab === 'schedule') await schLoadLead(openId); }
    if (page === 'conversations' && convId != null) { const d = await fetch('/demo/api/lead/' + convId); convDetail = d.ok ? await d.json() : null; }
    $('clock').textContent = new Date(data.clock).toLocaleString([], {weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    renderPage(true); if (openId != null) renderDrawer();
  } catch (e) { /* server restarting */ }
}

async function run(body, quiet) {
  try {
    const r = await fetch('/demo/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!quiet) toast(j.ok ? 'Done. The agent is reacting…' : (j.output || 'Failed').trim().split('\n').pop(), j.ok);
    if (['advance','reset_clock','seed'].includes(body.action)) await fetch('/demo/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'tick'})});
  } catch (e) { toast('Could not reach the agent', false); }
  await refresh(); setTimeout(refresh, 1200); setTimeout(refresh, 3000);
}

function renderShell() {
  $('nav').innerHTML = PAGES.map(p => {
    const n = !data ? 0 : p.id === 'alerts' ? data.alerts.length : p.id === 'conversations' ? data.leads.filter(l => l.last_msg).length : p.id === 'leads' ? data.leads.length : 0;
    return `<a href="#/${p.id}" class="nav-a ${p.id === page ? 'on' : ''}">${svg(p.icon)}<span class="flex-1">${p.label}</span>${n ? `<span class="text-[10px] font-semibold ${p.id === page ? 'bg-white/20' : 'bg-white/10'} rounded-full px-1.5 py-0.5">${n}</span>` : ''}</a>`; }).join('');
  const P = PAGES.find(x => x.id === page);
  $('pageTitle').textContent = P.title; $('pageSub').textContent = P.sub;
  const acts = {
    overview: `<button class="btn" onclick="location.hash='#/how'">How it works</button><button class="btn btn-primary" onclick="openImport()">⇪ Import leads</button>`,
    leads: `<button class="btn" onclick="openAdd()">+ Add lead</button><button class="btn btn-primary" onclick="openImport()">⇪ Import CSV / Excel</button>`,
    templates: `<button class="btn" onclick="tplNew('manual')">+ One-off email</button><button class="btn btn-primary" onclick="tplNew()">+ New template</button>`,
  };
  $('pageActions').innerHTML = acts[page] || '';
}

let lastRendered = '';
function renderPage(fromPoll) {
  renderShell();
  if (!data) { $('page').innerHTML = '<div class="text-sm text-slate-400">Loading…</div>'; return; }
  const html = ({overview: pOverview, leads: pLeads, conversations: pConversations, templates: pTemplates, schedule: pSchedule, alerts: pAlerts, how: pHow, settings: pSettings}[page])();
  if (fromPoll && html === lastRendered) return;
  // keep typed text and focus across re-renders
  const focused = document.activeElement && document.activeElement.id;
  const keep = {}; document.querySelectorAll('#page input, #page textarea').forEach(e => { if (e.id) keep[e.id] = e.value; });
  lastRendered = html;
  $('page').innerHTML = html;
  Object.entries(keep).forEach(([id, v]) => { const e = $(id); if (e) e.value = v; });
  if (focused && $(focused) && $('page').contains($(focused))) { const e = $(focused); e.focus(); try { e.setSelectionRange(e.value.length, e.value.length); } catch (_) {} }
  if (page === 'conversations') { const t = $('thread'); if (t) t.scrollTop = t.scrollHeight; }
}

// ------------------------------------------------------------------ Overview
function pOverview() {
  const f = data.funnel, max = Math.max(1, f[0].count);
  const kpi = (label, v, sub, accent='') => `<div class="card px-5 py-4"><div class="text-xs font-medium text-slate-500">${label}</div><div class="text-3xl font-semibold tabular-nums mt-1 ${accent}">${v}</div><div class="text-xs text-slate-400 mt-0.5">${sub}</div></div>`;
  const get = l => (f.find(x => x.label === l) || {count:0}).count;
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  if (!data.leads.length) return `<div class="card fade p-10 text-center max-w-2xl mx-auto mt-6">
      <div class="mx-auto h-14 w-14 rounded-full bg-brand-50 text-brand-600 grid place-items-center text-2xl">⇪</div><h2 class="text-lg font-semibold mt-4">Start by adding your leads</h2>
      <p class="text-sm text-slate-500 mt-1 max-w-md mx-auto">Upload a CSV or Excel file. The agent checks each lead, picks email or WhatsApp, and starts following up on its own.</p>
      <div class="flex justify-center gap-2 mt-5"><button class="btn btn-primary" onclick="openImport()">⇪ Import CSV / Excel</button>
      <button class="btn" onclick="run({action:'seed'})">Load 5 sample leads</button></div></div>`;
  return `<div class="space-y-6 fade">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${kpi('Leads', get('Leads in'), get('Passed intake') + ' passed the intake checks')}
      ${kpi('Contacted', get('Contacted'), 'by email or WhatsApp')}
      ${kpi('Replied', get('Replied'), pct(get('Replied'), get('Contacted')) + ' reply rate · target 5–10%')}
      ${kpi('Meetings booked', get('Meeting booked'), get('Handed to sales') + ' handed to sales', 'text-emerald-600')}
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">
      <section class="card p-5 xl:col-span-3">
        <div class="flex items-baseline justify-between"><h2 class="font-semibold text-sm">Lead funnel</h2><span class="text-xs text-slate-400">from intake to sales · % = of the step before</span></div>
        <div class="mt-4 space-y-2.5">${f.map((x, i) => `<div class="flex items-center gap-3">
          <div class="w-32 text-xs text-slate-600 shrink-0">${x.label}</div>
          <div class="flex-1 h-7 bg-slate-50 rounded-md overflow-hidden"><div class="h-full rounded-md bg-gradient-to-r from-brand-500 to-violet-500 flex items-center justify-end pr-2 text-[11px] text-white font-semibold" style="width:${Math.max(x.count/max*100, x.count ? 6 : 0)}%">${x.count || ''}</div></div>
          <div class="w-12 text-right text-xs text-slate-400 tabular-nums">${i ? pct(x.count, f[i-1].count) : ''}</div></div>`).join('')}</div>
      </section>
      <section class="card p-5 xl:col-span-2">
        <div class="flex items-baseline justify-between"><h2 class="font-semibold text-sm">Where leads are now</h2><a href="#/leads" class="text-xs text-brand-600 hover:underline">All leads →</a></div>
        <div class="mt-4 grid grid-cols-2 gap-2">${GROUPS.slice(1).map(g => { const n = data.leads.filter(l => (STATE[l.state]||{}).group === g).length;
          return `<button onclick="leadFilter='${g}';location.hash='#/leads'" class="text-left rounded-lg border border-slate-200 hover:border-brand-500 px-3 py-2.5"><div class="text-xs text-slate-500">${g}</div><div class="text-xl font-semibold tabular-nums">${n}</div></button>`; }).join('')}</div>
      </section>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
      <section class="card">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center gap-2"><span class="h-2 w-2 rounded-full bg-emerald-500 pulse"></span><h2 class="font-semibold text-sm">Live activity</h2></div>
        <div class="divide-y divide-slate-100 max-h-[420px] overflow-y-auto thin">${data.feed.slice(0, 25).map(e => `
          <button onclick="openLead(${e.lead_id})" class="w-full text-left px-5 py-3 hover:bg-slate-50 flex gap-3">
            <div class="min-w-0 flex-1"><div class="text-sm"><span class="font-medium">${esc(evTitle(e))}</span> <span class="text-slate-400">·</span> <span class="text-brand-700">${esc(e.lead||'')}</span>${evTag(e)}</div>
            <div class="text-xs text-slate-500 truncate">${esc(prettySummary(e))}</div></div><div class="text-[11px] text-slate-400 whitespace-nowrap">${when(e.at)}</div></button>`).join('') || empty('No activity yet.')}</div>
      </section>
      <section class="card">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between"><h2 class="font-semibold text-sm">Sales alerts</h2><a href="#/alerts" class="text-xs text-brand-600 hover:underline">All alerts →</a></div>

const TAP = {BOOK_DEMO:'👆 Tapped “Book a demo”', ASK_QUESTION:'👆 Tapped “Ask a question”'};
const TAP_BTN = {BOOK_DEMO:'book_demo', ASK_QUESTION:'ask_question'};
// One WhatsApp message as the lead's phone shows it: template text with its quick-reply buttons,
// or a text with its link button. preview: shown before sending (faded, buttons not tappable).
function bubble(m, d, preview) {
  const out = m.direction === 'out', v = m.view || {kind:'text', text:m.text}, bg = out ? 'bg-[#d9fdd3]' : 'bg-white';
  const who = m.author === 'bot' ? '🤖 Ozoo bot' : m.author === 'human' ? '👤 Sales' : esc(d.lead.name);
  const text = v.kind === 'text' ? (TAP[v.text] || esc(v.text)) : esc(v.text);
  const tag = v.kind === 'template' ? `<div class="text-[10px] text-slate-500 mb-1">📨 Approved template · ${esc(v.name)}</div>` : '';
  let btns = '';
  if (v.kind === 'template') btns = (v.buttons || []).map(b => preview
      ? `<button disabled class="wa-btn ${bg}">↩ ${esc(b.label)}</button>`
      : `<button class="wa-btn ${bg}" title="Demo: tap as ${esc(d.lead.name)}" onclick="run({action:'wa_button',lead:${d.lead.id},button:'${TAP_BTN[b.payload] || ''}'})">↩ ${esc(b.label)}</button>`).join('');
  if (v.kind === 'cta') btns = `<div class="wa-btn ${bg}">🔗 ${esc(v.cta)}</div>`;
  return `<div class="flex ${out ? 'justify-end' : 'justify-start'} ${preview ? 'opacity-70' : ''}"><div class="max-w-[80%] min-w-[220px]">
    <div class="rounded-lg px-3 py-2 shadow-sm ${bg} ${preview ? 'border border-dashed border-slate-400' : ''}">
      <div class="text-[10px] font-semibold ${out ? 'text-emerald-700' : 'text-slate-500'}">${who}</div>${tag}<div class="text-sm whitespace-pre-wrap">${text}</div>
      <div class="text-[10px] text-slate-400 text-right">${preview ? 'not sent yet' : when(m.at)}</div></div>${btns}</div></div>`;
}
function bubbles(d) {
  if (!d.chat.length) return waPreview(d);
  return d.chat.map(m => bubble(m, d, false)).join('');

function waPreview(d) {

}

// ------------------------------------------------------------------ modals: import + add lead
function openModal(html, wide) {
  $('modal').className = `fade bg-white rounded-2xl shadow-2xl w-full ${wide ? 'max-w-7xl h-[92vh]' : 'max-w-4xl max-h-[90vh]'} flex flex-col`;
  $('modal').innerHTML = html; $('modalWrap').classList.remove('hidden'); }
function closeModal() { $('modalWrap').classList.add('hidden'); tplPv = null; tplEd = null; }
$('modalWrap').addEventListener('click', e => { if (e.target === $('modalWrap')) closeModal(); });

let impFile = null;
const OUT = {accepted:['Accepted, outreach started','bg-emerald-50 text-emerald-700'], held_eu:['Held: EU, waiting for approval','bg-amber-50 text-amber-700'],
  held_account:['Held: a colleague is already talking to us','bg-amber-50 text-amber-700'], held_verify:['Held: email check pending','bg-amber-50 text-amber-700'],
  duplicate:['Already in the system','bg-slate-100 text-slate-600'], skipped_duplicate:['Already in the system','bg-slate-100 text-slate-600'],
  suppressed:['On the do-not-contact list','bg-rose-50 text-rose-700'], skipped_suppressed:['On the do-not-contact list','bg-rose-50 text-rose-700'],
  rejected:['Rejected','bg-rose-50 text-rose-700'], skipped:['Skipped: missing data','bg-slate-100 text-slate-500'], error:['Error','bg-rose-50 text-rose-700']};
const FIELD_L = {name:'Name', first_name:'First name', last_name:'Last name', company:'Company', role:'Role', email:'Email', phone:'Phone / WhatsApp', country:'Country', consent_whatsapp:'WhatsApp opt-in', industry:'Industry', size:'Company size'};
const modalHead = (t, s) => `<div class="px-6 py-4 border-b border-slate-100 flex items-start justify-between gap-4"><div><h3 class="font-semibold">${t}</h3><p class="text-xs text-slate-500 mt-0.5">${s}</p></div><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">×</button></div>`;

function openImport(err) {
  impFile = null;
  openModal(`${modalHead('Import leads', 'Upload a CSV or Excel file. Each lead goes through the intake checks, then the agent starts outreach on its own.')}
    <div class="p-6 space-y-4 overflow-y-auto thin">
      <label id="drop" class="block border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-xl p-12 text-center cursor-pointer transition">
        <input type="file" id="impInput" accept=".csv,.xlsx,.xlsm,.txt" class="hidden">
        <div class="mx-auto h-12 w-12 rounded-full bg-brand-50 text-brand-600 grid place-items-center text-xl">⇪</div>
        <div class="font-medium mt-3">Drop your file here, or click to choose</div>
        <div class="text-xs text-slate-500 mt-1">.csv or .xlsx · up to 2,000 leads</div></label>
      ${err ? `<div class="text-sm text-rose-700 bg-rose-50 rounded-lg px-3 py-2">${esc(err)}</div>` : ''}
      <div class="text-xs text-slate-500 bg-slate-50 rounded-lg px-4 py-3"><b class="text-slate-700">Columns we recognise:</b> Name (or First name + Last name), Company, Role / Title, Email, Phone / WhatsApp, Country, WhatsApp opt-in (yes/no).
        Each lead needs a name, a company and an email or a phone. Leads with only a phone need WhatsApp opt-in.</div></div>
    <div class="px-6 py-4 border-t border-slate-100 flex justify-between"><a href="/demo/api/sample.csv" class="btn">⤓ Download template</a><button class="btn" onclick="closeModal()">Cancel</button></div>`);
  const input = $('impInput'), drop = $('drop');
  input.onchange = () => input.files[0] && impPreview(input.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('border-brand-500', 'bg-brand-50'); };
  drop.ondragleave = () => drop.classList.remove('border-brand-500', 'bg-brand-50');
  drop.ondrop = e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) impPreview(f); };
}
async function impPreview(file) {
  impFile = file;
  openModal(`${modalHead('Import leads', 'Reading ' + esc(file.name) + '…')}<div class="p-10 text-center text-sm text-slate-400">Reading the file…</div>`);
  const r = await fetch('/demo/api/import', {method:'POST', headers:{'X-Filename': file.name}, body: file});
  const j = await r.json();
  if (!r.ok) return openImport(j.error || ('HTTP ' + r.status));
  const bad = j.total - j.ready;
  openModal(`${modalHead('Check before importing', `${esc(file.name)} · ${j.total} rows · ${j.ready} ready${bad ? ` · ${bad} will be skipped` : ''}`)}
    <div class="p-6 space-y-4 overflow-y-auto thin">
      <div><div class="text-xs font-medium text-slate-500 mb-1.5">We matched these columns</div><div class="flex flex-wrap gap-1.5">${Object.entries(j.columns).map(([f, c]) =>
        `<span class="text-[11px] bg-brand-50 text-brand-700 rounded-full px-2.5 py-1">“${esc(c)}” → ${esc(FIELD_L[f] || f)}</span>`).join('')}</div></div>
      <div class="border border-slate-200 rounded-lg overflow-x-auto thin"><table class="w-full text-xs">
        <thead class="bg-slate-50 text-slate-500"><tr>${['Row','Name','Company','Role','Email','Phone','WhatsApp opt-in',''].map(h => `<th class="text-left font-medium px-3 py-2 whitespace-nowrap">${h}</th>`).join('')}</tr></thead>
        <tbody class="divide-y divide-slate-100">${j.rows.map(x => { const p = x.payload; return `<tr class="${x.problems.length ? 'bg-amber-50/60' : ''}">
          <td class="px-3 py-2 text-slate-400">${x.row}</td><td class="px-3 py-2 font-medium">${esc(p.name)}</td><td class="px-3 py-2">${esc(p.company)}</td><td class="px-3 py-2">${esc(p.role === 'Not given' ? '' : p.role)}</td>
          <td class="px-3 py-2">${esc(p.email || '')}</td><td class="px-3 py-2">${esc(p.phone || '')}</td><td class="px-3 py-2">${p.consent_whatsapp ? '✓' : ''}</td>
          <td class="px-3 py-2 whitespace-nowrap">${x.problems.length ? `<span class="text-amber-700">⚠ ${esc(x.problems.join(', '))}</span>` : '<span class="text-emerald-700">✓ Ready</span>'}</td></tr>`; }).join('')}</tbody></table></div>
      ${j.total > j.rows.length ? `<div class="text-xs text-slate-400">Showing the first ${j.rows.length} of ${j.total} rows.</div>` : ''}
      ${schImportBar()}</div>
    <div class="px-6 py-4 border-t border-slate-100 flex justify-between gap-2"><button class="btn" onclick="openImport()">← Choose another file</button>
      <button class="btn btn-primary" id="impGo" ${j.ready ? '' : 'disabled'} onclick="impCommit()">Import ${j.ready} lead${j.ready === 1 ? '' : 's'} and start outreach</button></div>`);
}
async function impCommit() {
  $('impGo').disabled = true; $('impGo').textContent = 'Importing… the agent checks each lead';
  const r = await fetch('/demo/api/import?commit=1' + schImportQuery(), {method:'POST', headers:{'X-Filename': impFile.name}, body: impFile});
  const j = await r.json();
  if (!r.ok) return openImport(j.error || ('HTTP ' + r.status));
  const keys = Object.keys(OUT).filter(k => j.summary[k]);
  openModal(`${modalHead('Import finished', `${j.summary.accepted || 0} of ${j.results.length} leads accepted. The agent has started on them.`)}
    <div class="p-6 space-y-4 overflow-y-auto thin">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${keys.map(k => `<div class="rounded-xl px-4 py-3 ${OUT[k][1]}"><div class="text-2xl font-semibold">${j.summary[k]}</div><div class="text-xs">${OUT[k][0]}</div></div>`).join('')}</div>
      <div class="border border-slate-200 rounded-lg overflow-x-auto thin"><table class="w-full text-xs"><thead class="bg-slate-50 text-slate-500"><tr>${['Row','Name','Result','Channel'].map(h => `<th class="text-left font-medium px-3 py-2">${h}</th>`).join('')}</tr></thead>
        <tbody class="divide-y divide-slate-100">${j.results.map(x => `<tr><td class="px-3 py-2 text-slate-400">${x.row}</td><td class="px-3 py-2 font-medium">${esc(x.name)}</td>
          <td class="px-3 py-2"><span class="rounded-full px-2 py-0.5 ${(OUT[x.outcome] || OUT.error)[1]}">${esc((OUT[x.outcome] || [x.outcome])[0])}</span>${x.reason && x.outcome === 'skipped' ? ` <span class="text-slate-500">${esc(x.reason)}</span>` : ''}</td>
          <td class="px-3 py-2">${chan(x.channel)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="px-6 py-4 border-t border-slate-100 flex justify-end"><button class="btn btn-primary" onclick="closeModal();location.hash='#/leads'">See the leads</button></div>`);
  refresh();
}

function openAdd() {
  openModal(`${modalHead('Add a lead', 'Goes through the same intake checks as an import.')}
    <form id="addForm" class="p-6 grid grid-cols-2 gap-3 overflow-y-auto thin">
      ${[['name','Name *',''],['company','Company *',''],['role','Role',''],['country','Country','US']].map(([n, l, v]) =>
        `<label class="text-xs font-medium text-slate-600">${l}<input name="${n}" ${l.includes('*') ? 'required' : ''} value="${v}" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-normal"></label>`).join('')}
      <label class="text-xs font-medium text-slate-600 col-span-2">Email<input name="email" type="email" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-normal" placeholder="name@company.com"></label>
      <label class="text-xs font-medium text-slate-600 col-span-2">WhatsApp number (with country code)<input name="phone" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-normal" placeholder="+91 98…"></label>
      <label class="text-xs col-span-2 flex items-center gap-2 text-slate-600"><input type="checkbox" name="consent_whatsapp"> The lead opted in to WhatsApp messages</label>
      <div id="addErr" class="col-span-2 text-xs text-rose-600"></div>
      <div class="col-span-2 flex justify-end gap-2 pt-1"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Add lead</button></div></form>`);
  $('addForm').onsubmit = async ev => { ev.preventDefault();
    const f = new FormData(ev.target), body = {};
    for (const [k, v] of f.entries()) if (v !== '' && k !== 'consent_whatsapp') body[k] = v;
    body.consent_whatsapp = f.get('consent_whatsapp') === 'on';
    if (!body.email && !body.phone) { $('addErr').textContent = 'Add an email or a WhatsApp number.'; return; }
    if (!body.role) body.role = 'Not given';
    const r = await fetch('/demo/api/intake', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!j.lead_id) { $('addErr').textContent = 'Not added: ' + ((OUT[j.outcome] || [j.reason || j.outcome || j.error || r.status])[0]); return; }
    closeModal(); toast(`${body.name} added: ${(OUT[j.outcome] || [j.outcome])[0]}`);
    await run({action:'tick'}, true); openLead(j.lead_id); };
}

route(); refresh(); setInterval(refresh, 2500);

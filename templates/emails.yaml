    # MARKETING: replace
    standard:
      subject: "Quick idea for {company}"
      body: "Hi {first_name},\n\nI work with teams like {company} on automating outreach and follow-up. I think a short demo could be useful.\n\nBook a time: {booking_link}\n\nNot relevant? Unsubscribe: {unsubscribe_link}"

# Email copy: the 4-step sequence, its interest variants, and the replies.
#
# How a lead's email is put together (task 20):
# - Each lead gets an ANGLE from its role (then industry): collections, quality, sales, service,
#   technology, or general. The angle fills {topic} {hook} {value} {proof} {ask}.
# - A subject or body can be a LIST of alternatives. The agent picks one per lead (stable for that
#   lead, different across leads), so two people at the same bank don't get the same email.
# - Every email must make sense on its own: most people see only one of the four.
# - All four emails have a designed HTML version that still reads like a personal email (task 22;
#   email 1 designed too since task 23, the user's call): [[image]] = one product screen (rich.image: a file in static/email, or
#   `angle`), [[button]] = the purple booking button (in the plain text: "<button>: <link>"),
#   "> " paragraph = a use-case callout, "- " lines = a list. Keep to ONE text link besides
#   Unsubscribe: every extra link makes Gmail's Promotions tab more likely.
# - Facts only from kb/ozoo_kb.md. No prices. Never mention opens, clicks or reads.
#
# Placeholders: {first_name} {company} {signature} {booking_link} {unsubscribe_link} {pricing_link}
#   {case_study_link} {product_link} {voice_link} {chat_link} {trial_link} {homepage_link}
#   {angle_link} (the angle's product page); angle: {topic} {hook} {value} {proof} {ask} {usecase};
#   replies only: {answer} (question_answer) {follow_up_when} (not_now_ack).
# Step emails and the booking replies must contain {booking_link} (or [[button]]) and {unsubscribe_link}.
# MARKETING / SALES: review every line before go-live.

angles:
  collections:
    match: [collect, recover, dpd, delinquen, arrears]
    page: voice            # its product page: {angle_link}
    image: compliance-checks  # the screen in its designed emails
    topic: ["collections calls", "collections at scale", "EMI reminder calls"]
    hook:
      - "Most collections teams I speak with know their callers' promise-to-pay numbers, but can only listen to a small sample of the calls behind them."
      - "In collections, the calls that cause trouble are rarely the ones in the QA sample: manual review usually covers 2 to 5% of calls."
    value:
      - "Ozoo.ai checks every recorded collections call against your own scorecard and compliance rules, in Hindi, Hinglish and English, and our voice agents can take on EMI reminders, capturing promises to pay straight into your CRM."
      - "We help lenders review every collections call, not a sample, and add AI calling for EMI reminders that respects DND, pacing rules and consent prompts."
    proof:
      - "In a proof of concept with an Indian NBFC handling about 1,500 recovery and service calls a day, every recorded call was analysed (against a 2 to 5% sample before), and 18 compliance flags came up that the manual sample had missed."
    ask:
      - "Would it be useful to compare that with how {company} reviews collections calls today?"
      - "Is call quality in collections something you're looking at this year?"
    usecase:
      - "Use case: an Indian NBFC handling about 1,500 recovery and service calls a day put every recorded call through Post-Call Analytics instead of a 2 to 5% sample. The first pass found 18 compliance flags the sample had missed and 300 long-pending cases."
      - "Use case: your compliance team writes the fatal and critical rules for collections calls once. Every recorded call is checked against them in Hindi, Hinglish or English, each flag links to the moment in the call, and flags get a stricter second check."
  quality:
    match: [qa, quality, complian, risk, audit, grievance]
    page: product            # its product page: {angle_link}
    image: qa-scorecard  # the screen in its designed emails
    topic: ["call QA coverage", "call compliance", "QA on every call"]
    hook:
      - "Manual QA teams typically review 2 to 5% of calls, which leaves most compliance risk unheard."
      - "A QA sample tells you how the average call goes. It rarely finds the one call that turns into a complaint."
    value:
      - "Ozoo.ai's Post-Call Analytics scores every recorded call against your own QA scorecard. Every mark links to the exact moment in the transcript, and your fatal and critical rules get a stricter second check."
      - "Post-Call Analytics transcribes and scores every recorded call in Hindi, Hinglish and English, against the rules your compliance team defines, with the evidence one click away."
    proof:
      - "With one Indian NBFC, the first pass covered every recorded call in scope and surfaced 18 compliance flags the manual sample had missed."
    ask:
      - "How does {company} decide which calls get reviewed today?"
      - "Would a look at full-coverage QA be useful for {company}?"
    usecase:
      - "Use case: your QA team sets the scorecard and the fatal and critical rules once. Every recorded call is then scored, each mark links to the exact moment in the transcript, and flagged calls get a stricter second check before a reviewer sees them."
      - "Use case: calls are grouped from fatal to above baseline, with agent leaderboards, so coaching starts from the calls that matter instead of a random 2 to 5% sample."
  sales:
    match: [sales, tele, growth, retention, portfolio, cross, upsell, business, revenue, acquisition]
    page: product            # its product page: {angle_link}
    image: buying-signals  # the screen in its designed emails
    topic: ["signals hidden in your calls", "tele-sales calls", "retention calls"]
    hook:
      - "Service and collections calls often carry sales signals, such as a top-up, a balance transfer or a new loan, that never reach the sales team."
      - "Lenders already talk to their borrowers every day. Most of what is said on those calls is never read."
    value:
      - "Ozoo.ai's Post-Call Analytics reads every recorded call and flags buying signals, and our voice agents can qualify leads and run renewal calls in Hindi, English and other Indian languages."
      - "We analyse every recorded call for interest in top-ups, balance transfers or new loans, and can add AI calling for lead qualification and renewals."
    proof:
      - "In a proof of concept with an Indian NBFC, the first pass over its calls found 150 upsell and retention signals."
    ask:
      - "Would it help to see what that looks like on {company}'s own calls?"
      - "Is turning existing calls into pipeline on your list this year?"
    usecase:
      - "Use case: on a service call, a borrower asks about a top-up loan. Post-Call Analytics flags it as a buying signal, so it reaches your sales team instead of staying in a recording. With one NBFC, the first pass found 150 upsell and retention signals."
      - "Use case: interest in a balance transfer or a new loan, mentioned on a collections or service call, is flagged as a buying signal, so your sales team can call back while the borrower is still interested."
  service:
    match: [cx, customer, service, operation, onboard, contact, call cent, experience, support, kyc]
    page: chat            # its product page: {angle_link}
    image: borrower-online  # the screen in its designed emails
    topic: ["borrower conversations", "KYC follow-ups", "service calls and chats"]
    hook:
      - "A lot of service and onboarding effort goes into the same conversations: KYC documents, EMI queries, statement requests."
      - "Borrowers move between calls, WhatsApp and chat, and the context rarely moves with them."
    value:
      - "Ozoo.ai's chat agents handle KYC document chasing, EMI queries and statement requests on WhatsApp, web and in-app chat, answering from your own documents, and hand over to a person with the transcript when needed."
      - "We give lenders AI agents for WhatsApp, chat and voice that share one conversation history, answer from your own policy documents, and pass to your team with the full transcript."
    proof:
      - "Most lenders we work with start with Post-Call Analytics on the recordings they already have: with one Indian NBFC, that meant every recorded call reviewed instead of a 2 to 5% sample."
    ask:
      - "Which of these conversations takes the most of {company}'s team's time today?"
      - "Would a short look be useful for {company}'s service team?"
    usecase:
      - "Use case: a borrower sends KYC documents on WhatsApp, asks about an EMI in web chat, and calls a week later. The chat agent answers from your own policy documents, keeps one history across channels, and hands over to your team with the transcript when needed."
      - "Use case: statement requests and EMI queries on WhatsApp are answered from your own FAQs and policy PDFs, day and night, and anything unusual goes to a person with the full conversation attached."
  technology:
    match: [cto, cio, cdo, technolog, it, digital, engineering, data, architect, infosec, security]
    page: product            # its product page: {angle_link}
    image: call-analysis  # the screen in its designed emails
    topic: ["call analytics in your own AWS account", "conversation AI for {company}"]
    hook:
      - "Most conversation-AI tools ask lenders to send call recordings to someone else's cloud."
      - "Call analytics usually stalls at the same question: where does the data go?"
    value:
      - "Ozoo.ai's Post-Call Analytics installs from AWS Marketplace into your own AWS account in Mumbai, and Habilelabs has no access to the recordings, transcripts or results. The setup itself takes under an hour."
      - "Our Post-Call Analytics runs inside your own AWS account in Mumbai, masks Aadhaar, PAN and account numbers in transcripts, and the voice agents work with your existing SIP trunks or contact-centre platform."
    proof:
      - "Most teams have their scorecards and agents set up within a week, and there is a 30-day trial of the Starter plan with no software charge for buyers in India."
    ask:
      - "Would a short technical walkthrough be useful for {company}?"
      - "Who on your side usually reviews tools like this?"
    usecase:
      - "Use case: Post-Call Analytics is bought on AWS Marketplace and installed into your own AWS account in Mumbai in under an hour. Transcripts mask Aadhaar, PAN, account numbers and dates of birth, and Habilelabs has no access to the data."
      - "Use case: role-based access, an audit trail of QA overrides and admin changes, and data retention you set from 30 days to four years, all inside your own AWS account in Mumbai."
  general:
    match: []
    page: homepage            # its product page: {angle_link}
    image: call-analysis  # the screen in its designed emails
    topic: ["call quality at {company}", "borrower conversations at {company}", "every call at {company}"]
    hook:
      - "Lenders talk to borrowers all day, on calls and on WhatsApp, but usually only check a small sample of those conversations."
      - "Manual QA teams typically review 2 to 5% of calls. The rest is never heard."
    value:
      - "Ozoo.ai is built only for lenders and insurers: Post-Call Analytics checks every recorded call for quality and compliance, and our voice and WhatsApp agents handle EMI reminders, collections and KYC follow-up."
      - "We help banks, NBFCs and insurers talk to every borrower and check every call, with call analytics, AI calling and WhatsApp agents that share one memory."
    proof:
      - "In a proof of concept with an Indian NBFC handling about 1,500 calls a day, every recorded call was analysed, and the first pass found 18 compliance flags the manual sample had missed and 150 upsell and retention signals."
    ask:
      - "Is this something {company} is looking at?"
      - "Would a short conversation be useful?"
    usecase:
      - "Use case: an Indian NBFC handling about 1,500 calls a day analysed every recorded call in its first pass: 18 compliance flags the manual sample had missed, 300 long-pending cases and 150 upsell and retention signals."
      - "Use case: a lender starts with Post-Call Analytics on the recordings it already has, adds one voice journey such as EMI reminders, then WhatsApp, and all three share one memory of each borrower."


replies:
  # interested
  booking_link:
    body:
      - |-
        Hi {first_name},

        Thank you, glad {topic} is of interest. You can pick any 30-minute slot that suits you here: {booking_link}

        If none of the times work, reply with two or three that do and we'll make one of them work.

        {signature}

        Unsubscribe: {unsubscribe_link}
      - |-
        Hi {first_name},

        Thanks for getting back to me. Here's a link to choose a 30-minute slot: {booking_link}

        It helps to know which part matters most for {company} (call QA, voice agents or WhatsApp), so we can tailor the conversation. A line in reply is plenty.

        {signature}

        Unsubscribe: {unsubscribe_link}
  booking_slots:
    body: |-
      Hi {first_name},

      Happy to find a time. Choose any open slot here: {booking_link}

      {signature}

      Unsubscribe: {unsubscribe_link}
  reschedule:
    body: |-
      Hi {first_name},

      No problem at all. Let's find a new time: {booking_link}

      {signature}

      Unsubscribe: {unsubscribe_link}
  # a question the knowledge base answers ({answer} is checked: KB facts only, no links, no prices)
  question_answer:
    body:
      - |-
        Hi {first_name},

        Thanks for the question.

        {answer}

        If it's easier to go through it with your own use case in mind, pick any 30-minute slot: {booking_link}

        {signature}

        Unsubscribe: {unsubscribe_link}
      - |-
        Hi {first_name},

        Good question. {answer}

        Happy to go deeper on a short call if useful: {booking_link}

        {signature}

        Unsubscribe: {unsubscribe_link}
  # a question the knowledge base can't answer: a person replies (sales get the alert)
  question_ack:
    body: |-
      Hi {first_name},

      Thanks for the question about {topic}. I'd rather give you an accurate answer than a quick one, so I've passed it to a colleague who works on this; you'll hear back within one business day.

      If a conversation is easier, you can also pick a 30-minute slot: {booking_link}

      {signature}

      Unsubscribe: {unsubscribe_link}
  # not now
  not_now_ack:
    body: |-
      Hi {first_name},

      Thanks for letting me know, completely understood. I'll check back {follow_up_when}. If anything changes before then, just reply here.

      {signature}
  # not interested
  not_interested_ack:
    body: |-
      Hi {first_name},

      Thank you for the reply, and understood. I won't follow up.

      If call quality, collections calling or borrower chat ever comes onto your list, a reply to this email will reach us.

      {signature}
  # wrong person, and they named someone
  referral_thanks:
    body: |-
      Hi {first_name},

      Thank you, that's really helpful. I'll reach out to them directly and won't write to you about this again.

      {signature}
  # wrong person, nobody named
  who_is_right:
    body: |-
      Hi {first_name},

      Thanks for letting me know, and sorry for the misdirected note. Who would be the right person at {company} for call quality or borrower conversations? A name is plenty; I'll take it from there.

      {signature}
